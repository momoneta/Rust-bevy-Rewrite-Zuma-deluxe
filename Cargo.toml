[package]
name = "zuma"
version = "0.1.0"
edition = "2024"
description = "Zuma Deluxe rewritten in Rust with Bevy (uses the original game data files)"
license = "MIT"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "audio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
roxmltree = "0.21"
rand = "0.9"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
